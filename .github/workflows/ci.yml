name: BankPulse CI

on:
  push:
    branches:
      - main
      - feat/githubActions
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests and Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare dataset
        run: python -m scripts.ci.prepareCiData

      - name: Prepare model
        run: python -m scripts.ci.prepareCiModel

      - name: Run automated tests
        run: python -m pytest tests/ -v

      - name: Build Docker image
        run: docker build -t bankpulse-api:ci .
